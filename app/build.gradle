plugins {
 id 'com.android.application'
 id 'org.jetbrains.kotlin.android'
}
android {
 namespace 'vn.loctm.originbridge'
 compileSdk 36
 buildToolsVersion "36.0.0"
 sourceSets { main { java.srcDirs = ['src/bridge/kotlin'] } }
 flavorDimensions 'delivery'
 productFlavors {
  diagnostic { dimension 'delivery' }
  nativeSuperx {
   dimension 'delivery'
   applicationId 'com.autonavi.minimap'
   manifestPlaceholders = [bridgeLabel: 'LTMori']
   versionCode 29
   versionName '1.1.2'
  }
 }
 defaultConfig { applicationId 'vn.loctm.originbridge'; minSdk 34; targetSdk 36; versionCode 5; versionName '1.0.0-alpha5'; manifestPlaceholders = [bridgeLabel: 'LTM Origin Bridge'] }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
 kotlinOptions { jvmTarget = '17' }
 buildTypes { release { minifyEnabled false } }
}

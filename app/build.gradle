plugins { id 'com.android.application' }
def propsFile = rootProject.file('keystore.properties')
def signingProps = new Properties()
if (propsFile.exists()) propsFile.withInputStream { signingProps.load(it) }
android {
 namespace 'vn.loctm.dynamicorigin'
 compileSdk 36
 buildToolsVersion "36.0.0"
 defaultConfig { applicationId 'vn.loctm.dynamicorigin'; minSdk 34; targetSdk 36; versionCode 8; versionName '0.6.1' }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
 signingConfigs { if (propsFile.exists()) { release { storeFile file(signingProps['storeFile']); storePassword signingProps['storePassword']; keyAlias signingProps['keyAlias']; keyPassword signingProps['keyPassword'] } } }
 buildTypes { release { minifyEnabled false; if (propsFile.exists()) signingConfig signingConfigs.release } }
}
